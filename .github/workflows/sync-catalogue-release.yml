name: Sync Catalogue Release

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/repo of the product that was released
        required: true
        type: string
      tag:
        description: Optional vX.Y.Z; re-fetched from GitHub and ignored if unstable
        required: false
        type: string

concurrency:
  group: sync-catalogue-release-${{ inputs.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  sync-catalogue-release:
    name: Sync Catalogue Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install "PyYAML==6.0.3"

      - name: Resolve stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${REPOSITORY}" != */* ]]; then
            echo "::error::repository must be owner/repo"
            exit 1
          fi
          if [[ -n "${TAG}" ]]; then
            API="repos/${REPOSITORY}/releases/tags/${TAG}"
          else
            API="repos/${REPOSITORY}/releases/latest"
          fi
          set +e
          JSON="$(gh api "${API}" 2>gh-api.err)"
          code=$?
          set -e
          if [[ "${code}" -ne 0 ]]; then
            if grep -Eq 'HTTP 404' gh-api.err; then
              JSON=""
            else
              cat gh-api.err >&2
              echo "::error::GitHub Release API failed"
              exit 1
            fi
          fi
          printf '%s' "${JSON}" | PYTHONPATH=src python3 -m catalogue_release_sync resolve \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Apply catalogue YAML
        if: steps.release.outputs.skip != 'true'
        id: apply
        env:
          REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASED_DATE: ${{ steps.release.outputs.released_date }}
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=src python3 -m catalogue_release_sync apply \
            --file data/projects.yml \
            --repository "${REPOSITORY}" \
            --version "${VERSION}" \
            --released-date "${RELEASED_DATE}" \
            --write
          code=$?
          set -e
          if [[ "${code}" -eq 0 ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${code}" -eq 2 ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::error::catalogue sync failed with exit ${code} (3 means ambiguous repository URLs)"
          exit 1

      - name: Resolve catalogue card
        if: steps.release.outputs.skip != 'true' && steps.apply.outputs.changed == 'true'
        id: card
        env:
          REPOSITORY: ${{ inputs.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASED_DATE: ${{ steps.release.outputs.released_date }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import os
          from pathlib import Path
          from catalogue_release_sync import apply_catalogue_release

          result = apply_catalogue_release(
              Path("data/projects.yml").read_text(encoding="utf-8"),
              repository=os.environ["REPOSITORY"],
              version=os.environ["VERSION"],
              released_date=os.environ["RELEASED_DATE"],
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"card_id={result.card_id}\n")
              fh.write(f"card_name={result.card_name}\n")
          PY

      - name: Open or update pull request
        if: steps.release.outputs.skip != 'true' && steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASED_DATE: ${{ steps.release.outputs.released_date }}
          REPOSITORY: ${{ inputs.repository }}
          CARD_ID: ${{ steps.card.outputs.card_id }}
          CARD_NAME: ${{ steps.card.outputs.card_name }}
        run: |
          set -euo pipefail
          BRANCH="catalogue/release-${CARD_ID}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add data/projects.yml
          git commit -m "Release ${CARD_NAME} ${VERSION} on the catalogue."
          git push -u origin "${BRANCH}" --force
          BODY="Sets \`banner: released\`, \`version: \"${VERSION}\"\`,"
          BODY="${BODY} and \`released_date\` for **${CARD_NAME}**"
          BODY="${BODY} from the GitHub Release on \`${REPOSITORY}\`."
          if gh pr view "${BRANCH}" --json url >/dev/null 2>&1; then
            echo "Updated existing pull request for ${BRANCH}"
          else
            gh pr create \
              --title "Release ${CARD_NAME} ${VERSION} on the catalogue." \
              --body "${BODY}" \
              --head "${BRANCH}" \
              --base master
          fi
