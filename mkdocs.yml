# =============================================================================
# Site Information
# =============================================================================

site_name: The Lupaxa Project

site_description: >-
  The central portal for projects, organisations, toolboxes and documentation
  contained across The Lupaxa Project ecosystem.

site_author: The Lupaxa Project

site_url: https://thelupaxaproject.org/

# =============================================================================
# Source Repository
# =============================================================================

repo_name: the-lupaxa-project/the-lupaxa-project.github.io

repo_url: https://github.com/the-lupaxa-project/the-lupaxa-project.github.io

edit_uri: edit/master/mkdocs/

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs

site_dir: site

use_directory_urls: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material

  language: en

  logo: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo.png

  favicon: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo-128.png

  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
  - Toolboxes:
      - Overview: toolboxes/index.md
  - Organisations:
      - Overview: organisations/index.md
  - Documentation:
      - Overview: documentation/index.md

# =============================================================================
# Markdown Extensions
# =============================================================================

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/portal.js

# =============================================================================
# Additional Metadata
# =============================================================================

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/the-lupaxa-project
      name: The Lupaxa Project on GitHub

# =============================================================================
# Copyright
# =============================================================================

copyright: >-
  Copyright &copy; The Lupaxa Project.
  Where exploration meets precision.
  Where the untamed meets the engineered.
