# =============================================================================
# Site Information
# =============================================================================

site_name: The Lupaxa Project

site_description: >-
  The central portal for projects, organisations, toolboxes and documentation
  contained across The Lupaxa Project ecosystem.

site_author: The Lupaxa Project

site_url: https://thelupaxaproject.org/

extra:
  generator: false
  start_year: 2025
  footer_name: The Lupaxa Project
  footer_taglines:
    - Where exploration meets precision.
    - Where the untamed meets the engineered.
  # Counter.dev analytics (omit counter_dev_id to disable).
  counter_dev_id: ef410665-76d4-43fe-9e91-53f26ed1004b
  counter_dev_utcoffset: 0
  social_image: assets/images/social-card.png
  social_image_width: 1200
  social_image_height: 630
  social_logo: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo.png
  social_locale: en_GB
  theme_color: "#203959"
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs

site_dir: site

use_directory_urls: true

# Reload on catalogue data / macros changes during `mkdocs serve`
watch:
  - data
  - main.py
  - articles_lib.py
  - quotes_lib.py
  - gallery_lib.py
  - hooks

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides

  language: en

  logo: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo.png

  favicon: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo-128.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Plugins
# =============================================================================

plugins:
  - search
  - macros

hooks:
  - hooks/article_nav.py

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - About: about.md
  - Organisations: organisations.md
  - Projects: projects.md
  - Articles: articles.md
  - Policies: policies.md
  - Quotes: quotes.md
  - Gallery: gallery.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css

  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/cards.css
  - assets/stylesheets/40-components/catalogue.css
  - assets/stylesheets/40-components/filter-panel.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/footer.css
  - assets/stylesheets/40-components/masonry-wall.css

  - assets/stylesheets/50-pages/about.css
  - assets/stylesheets/50-pages/article.css
  - assets/stylesheets/50-pages/quotes.css
  - assets/stylesheets/50-pages/gallery.css

  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/page-lifecycle.js
  - assets/javascript/header-active-nav.js
  - assets/javascript/catalogue-filters.js
  - assets/javascript/masonry-wall.js
  - assets/javascript/quotes.js
  - assets/javascript/gallery.js

# =============================================================================
