# =============================================================================
# Site Information
# =============================================================================

site_name: The Lupaxa Project

site_description: >-
  The central portal for projects, organisations, toolboxes and documentation
  contained across The Lupaxa Project ecosystem.

site_author: The Lupaxa Project

site_url: https://thelupaxaproject.org/

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs

site_dir: site

use_directory_urls: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides

  language: en

  logo: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo.png

  favicon: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo-128.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - About: about.md
  - Organisations: organisations.md
  - Projects: projects.md
  - Policies: policies.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascript/navigation.js

# =============================================================================
# Additional Metadata
# =============================================================================

extra:
  generator: false

# =============================================================================
# Copyright
# =============================================================================

copyright: >
  <span class="footer-copyright">© 2026 <strong>The Lupaxa Project</strong>. All rights reserved.</span>
  <span class="footer-tagline">Where exploration meets precision.</span>
  <span class="footer-tagline">Where the untamed meets the engineered.</span>
