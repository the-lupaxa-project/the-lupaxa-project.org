# =============================================================================
# Site Information
# =============================================================================

site_name: The Lupaxa Project

site_description: >-
  The central portal for projects, organisations, toolboxes and documentation
  contained across The Lupaxa Project ecosystem.

site_author: The Lupaxa Project

site_url: https://thelupaxaproject.org/

extra:
  generator: false
  social_image: assets/images/social-card.png
  theme_color: "#203959"
  social_image_width: 1200
  social_image_height: 630
  social_locale: en_GB
  twitter_card: summary_large_image

# =============================================================================
# Content
# =============================================================================

docs_dir: mkdocs

site_dir: site

use_directory_urls: true

# =============================================================================
# Theme
# =============================================================================

theme:
  name: material
  custom_dir: overrides

  language: en

  logo: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo.png

  favicon: >-
    https://raw.githubusercontent.com/the-lupaxa-project/brand-assets/master/logos/organisations/the-lupaxa-project/readme-logo-128.png

  features:
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  icon:
    repo: fontawesome/brands/github

# =============================================================================
# Navigation
# =============================================================================

nav:
  - Home: index.md
  - About: about.md
  - Organisations: organisations.md
  - Projects: projects.md
  - Policies: policies.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      permalink_title: Link to this section
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# =============================================================================
# Additional Assets
# =============================================================================

extra_css:
  - assets/stylesheets/00-tokens.css
  - assets/stylesheets/10-base.css
  - assets/stylesheets/20-layout.css
  - assets/stylesheets/30-navigation.css

  - assets/stylesheets/40-components/buttons.css
  - assets/stylesheets/40-components/cards.css
  - assets/stylesheets/40-components/filter-panel.css
  - assets/stylesheets/40-components/hero.css
  - assets/stylesheets/40-components/footer.css

  - assets/stylesheets/50-pages/about.css
  - assets/stylesheets/50-pages/home.css
  - assets/stylesheets/50-pages/organisations.css
  - assets/stylesheets/50-pages/projects.css
  - assets/stylesheets/50-pages/policies.css
  - assets/stylesheets/50-pages/documentation.css
  - assets/stylesheets/50-pages/toolboxes.css

  - assets/stylesheets/90-responsive.css
  - assets/stylesheets/95-print.css
  - assets/stylesheets/99-overrides.css

extra_javascript:
  - assets/javascript/navigation.js

# =============================================================================
# Copyright
# =============================================================================

copyright: >
  <span class="footer-copyright">© 2026 <strong>The Lupaxa Project</strong>. All rights reserved.</span>
  <span class="footer-tagline">Where exploration meets precision.</span>
  <span class="footer-tagline">Where the untamed meets the engineered.</span>
