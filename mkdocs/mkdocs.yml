site_name: The Lupaxa Project
site_description: The central portal for projects, organisations, documentation and shared resources across The Lupaxa Project
  ecosystem.
site_url: https://thelupaxaproject.org/
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: en
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
plugins:
- search:
    lang: en
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc
- pymdownx.details: {}
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite: {}
- pymdownx.snippets: {}
- pymdownx.superfences: {}
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
