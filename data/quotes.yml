    author: Bruce Schneier
    year: 2000
    tags:
      - engineering
      - risk
    card_color: '#15233f'
    text_color: '#e8eef8'

  - text: The only truly secure system is one that is powered off, cast in a block of concrete
      and sealed in a lead-lined room with armed guards - and even then I have my doubts.
    published: true
    author: Gene Spafford
    year: 1989
    tags:
      - engineering
      - risk
      - work
    card_color: '#182a4c'
    text_color: '#eaeff7'

  - text: Security engineering is about building systems to remain dependable in the face
      of malice, error, or mischance.
    published: true
    author: Ross Anderson
    year: 2001
    tags:
      - engineering
      - risk
    card_color: '#1c3358'
    text_color: '#f0f4fa'

  - text: Given enough eyeballs, all bugs are shallow.
