quotes:
  - text: Failure is an option here. If things are not failing, you are not innovating enough.
    published: true
    author: Elon Musk
    year: 2005
    tags:
      - work
      - risk
    card_color: '#2c5173'
    text_color: '#f8fafc'

  - text: The most common mistake of smart engineers is to optimize a thing that should not
      exist.
    published: true
    author: Elon Musk
    year: 2021
    tags:
      - work
      - simplicity
      - engineering
    card_color: '#42759a'
    text_color: '#ffffff'

  - text: Perfection is achieved, not when there is nothing more to add, but when there is
      nothing left to take away.
    published: true
    author: Antoine de Saint-Exupéry
    year: 1939
    tags:
      - simplicity
      - product
    card_color: '#4b81a7'
    text_color: '#ffffff'

