    author: Eric S. Raymond
    year: 1999
    tags:
      - engineering
      - work
      - simplicity
    card_color: '#203959'
    text_color: '#f5f8fc'

  - text: At the very basic level, organizations should provide a clear way for someone to
      report issues.
    published: true
    author: Katie Moussouris
    year: 2017
    tags:
      - engineering
      - work
      - risk
    card_color: '#2c5173'
    text_color: '#f8fafc'

  - text: Risk is a necessary consequence of dependence.
    published: true
    author: Dan Geer
    year: 2013
    tags:
      - risk
      - engineering
    card_color: '#335d80'
    text_color: '#ffffff'

  - text: If you want to build truly large and long-lasting software, aim to build a free
