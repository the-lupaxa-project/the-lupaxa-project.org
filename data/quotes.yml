    published: true
    author: Jakob Nielsen
    tags:
      - product
    card_color: '#3a698d'
    text_color: '#ffffff'

  - text: The best code is no code at all.
    published: true
    author: Jeff Atwood
    year: 2007
    tags:
      - simplicity
      - engineering
    card_color: '#182a4c'
    text_color: '#eaeff7'

  - text: Simple can be harder than complex.
    published: true
    author: Steve Jobs
    year: 1998
    tags:
      - simplicity
