    author: Thomas Fuchs
    tags:
      - product
      - engineering
    card_color: '#2c5173'
    text_color: '#f8fafc'

  - text: UX is not about adding features. It's about removing barriers.
    published: true
    author: Unknown
    tags:
      - product
      - simplicity
    card_color: '#335d80'
    text_color: '#ffffff'

