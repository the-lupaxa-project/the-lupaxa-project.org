    published: true
    author: Pieter Hintjens
    year: 2016
    tags:
      - work
      - engineering
    card_color: '#3a698d'
    text_color: '#ffffff'

  - text: Over the last twenty years, open source has skewed from a collaborative to a solo
      endeavor.
    published: true
    author: Nadia Eghbal
    year: 2020
    tags:
      - work
    card_color: '#42759a'
    text_color: '#ffffff'

  - text: Complexity is the enemy of security.
    published: true
    author: Cory Doctorow
    year: 2005
    tags:
      - simplicity
      - risk
      - engineering
    card_color: '#4b81a7'
    text_color: '#ffffff'

  - text: It is simply unrealistic to depend on secrecy for security in computer software.
    published: true
    author: Whitfield Diffie
    year: 1996
    tags:
      - engineering
      - risk
    card_color: '#6d95d3'
    text_color: '#111a32'

  - text: Thinking that technology will solve your problems means you do not understand the
      technology and you do not understand your problems.
    published: true
    author: Bruce Schneier
    year: 2000
    tags:
      - engineering
      - work
      - risk
    card_color: '#111a32'
    text_color: '#e8eef8'
