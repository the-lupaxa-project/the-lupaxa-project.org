    author: Ken Thompson
    tags:
      - simplicity
      - engineering
    card_color: '#3a698d'
    text_color: '#ffffff'

  - text: The most disastrous thing that you can ever learn is your first programming language.
    published: true
    author: Alan Kay
    tags:
      - work
