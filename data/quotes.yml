    author: Fred Brooks
    year: 1975
    tags:
      - engineering
      - work
    card_color: '#203959'
    text_color: '#f5f8fc'

  - text: Good judgment comes from experience, and experience comes from bad judgment.
    published: true
    author: Fred Brooks
    year: 1975
    tags:
      - work
      - risk
    card_color: '#335d80'
    text_color: '#ffffff'

  - text: Security is a process, not a product.
    published: true
    author: Bruce Schneier
    year: 2000
    tags:
      - engineering
      - risk
    card_color: '#111a32'
    text_color: '#e8eef8'

