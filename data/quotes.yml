    published: true
    author: Bill Gates
    tags:
      - work
      - risk
    card_color: '#182a4c'
    text_color: '#eaeff7'

  - text: 'The most damaging phrase in the language is: ''We''ve always done it this way.'''
    published: true
    author: Grace Hopper
    tags:
      - work
    card_color: '#203959'
    text_color: '#f5f8fc'

  - text: The best error message is the one that never shows up.
