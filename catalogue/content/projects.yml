# =============================================================================
# Projects Catalogue
# =============================================================================
#
# This file is the editorial source of truth for projects displayed on the
# portal.
#
# Projects are never discovered or published automatically. A project only
# appears on the website when it is explicitly included here.
#
# Entries may optionally be enriched with metadata from GitHub during the build,
# but the values in this file remain authoritative.

projects:
  # ---------------------------------------------------------------------------
  # GitHub Repository Sync
  # ---------------------------------------------------------------------------

  - id: github-repository-sync

    name: GitHub Repository Sync

    repository: the-lupaxa-internal-toolbox/lupaxa-github-repo-sync

    description: >-
      Safely clone and synchronise large collections of GitHub repositories
      from a single declarative configuration.

    documentation_url: https://github-repo-sync.thelupaxaproject.org/

    repository_url: >-
      https://github.com/the-lupaxa-internal-toolbox/lupaxa-github-repo-sync

    organisation: internal-toolbox

    categories:
      - github
      - automation
      - repository-management

    technologies:
      - Python
      - GitHub API
      - YAML

    status: active

    maturity: stable

    visibility: public

    featured: true

    published: true

    order: 10

  # ---------------------------------------------------------------------------
  # GitHub Workflow Scheduler
  # ---------------------------------------------------------------------------

  - id: github-workflow-scheduler

    name: GitHub Workflow Scheduler

    repository: lupaxa/github-workflow-scheduler

    description: >-
      Dispatch scheduled GitHub Actions workflows using a central configuration
      and a reliable external scheduler.

    repository_url: https://github.com/lupaxa/github-workflow-scheduler

    organisation: github-toolbox

    categories:
      - github
      - automation
      - continuous-integration

    technologies:
      - Python
      - GitHub Actions
      - YAML

    status: active

    maturity: beta

    visibility: public

    featured: true

    published: true

    order: 20

  # ---------------------------------------------------------------------------
  # GitHub Workflow Re-enabler
  # ---------------------------------------------------------------------------

  - id: github-workflow-reenabler

    name: GitHub Workflow Re-enabler

    repository: the-lupaxa-project/github-workflow-reenabler

    description: >-
      Find GitHub Actions workflows disabled because of inactivity and safely
      re-enable them across repositories and organisations.

    repository_url: >-
      https://github.com/the-lupaxa-project/github-workflow-reenabler

    organisation: github-toolbox

    categories:
      - github
      - automation
      - workflow-management

    technologies:
      - Python
      - GitHub API

    status: active

    maturity: stable

    visibility: public

    featured: true

    published: true

    order: 30

  # ---------------------------------------------------------------------------
  # Shared Reusable Workflows
  # ---------------------------------------------------------------------------

  - id: shared-reusable-workflows

    name: Shared Reusable Workflows

    repository: the-lupaxa-project/workflows

    description: >-
      Reusable GitHub Actions workflows for repository quality, security,
      documentation, automation and continuous integration.

    repository_url: https://github.com/the-lupaxa-project/workflows

    organisation: the-lupaxa-project

    categories:
      - github
      - automation
      - continuous-integration

    technologies:
      - GitHub Actions
      - YAML

    status: active

    maturity: stable

    visibility: public

    featured: true

    published: true

    order: 40
