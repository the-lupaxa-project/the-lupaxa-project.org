# =============================================================================
# Organisations Catalogue
# =============================================================================
#
# This file controls which GitHub organisations appear on the portal.
#
# Organisations are never discovered or published automatically. An
# organisation only appears when it is explicitly included here and has
# published set to true.
#
# The descriptions and display names in this file are authoritative. GitHub
# metadata may be used for optional enrichment, but it must not replace the
# curated content defined here.

organisations:
  # ---------------------------------------------------------------------------
  # The Lupaxa Project
  # ---------------------------------------------------------------------------

  - id: the-lupaxa-project

    name: The Lupaxa Project

    github_organisation: the-lupaxa-project

    github_url: https://github.com/the-lupaxa-project

    description: >-
      The central public organisation containing shared standards,
      documentation, workflows, brand assets and project-wide resources.

    type: central

    categories:
      - project
      - shared-resources
      - documentation
      - automation

    featured: true

    published: true

    order: 10

