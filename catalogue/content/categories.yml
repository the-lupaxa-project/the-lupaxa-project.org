# =============================================================================
# Categories Catalogue
# =============================================================================
#
# This file defines the categories used throughout the portal.
#
# Categories are referenced by their id from projects, organisations and
# documentation entries. The display name, description, icon and ordering are
# controlled centrally here.
#
# Defining categories separately avoids duplicating presentation details across
# the other catalogue files and ensures consistent naming throughout the site.

