# =============================================================================
# Documentation Catalogue
# =============================================================================
#
# This file controls which documentation sites and documentation resources
# appear on the portal.
#
# Documentation is never discovered or published automatically. An entry only
# appears when it is explicitly included here and has published set to true.
#
# Documentation entries may be linked to a project or organisation, but they do
# not have to be. This allows the portal to include shared standards, reference
# material and organisation-wide documentation alongside project-specific
# documentation.

documentation:
  # ---------------------------------------------------------------------------
  # GitHub Repository Sync
  # ---------------------------------------------------------------------------

  - id: github-repository-sync

    name: GitHub Repository Sync

    description: >-
      Installation, configuration, usage and reference documentation for
      synchronising large collections of GitHub repositories.

    documentation_url: https://github-repo-sync.thelupaxaproject.org/

    project: github-repository-sync

    organisation: internal-toolbox

    categories:
      - github
      - repository-management
      - automation

    type: project

    status: active

    featured: true

    published: true

    order: 10

