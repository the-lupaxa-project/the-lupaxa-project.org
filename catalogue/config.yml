# =============================================================================
# Portal Configuration
# =============================================================================
#
# This file controls portal-wide behaviour and presentation.
#
# Catalogue content remains in the dedicated projects, organisations,
# documentation and categories files. This file only contains settings that
# apply across the generated portal.

portal:
  name: The Lupaxa Project

  description: >-
    The central portal for projects, organisations, toolboxes and documentation
    contained across The Lupaxa Project ecosystem.

  base_url: https://thelupaxaproject.org/

  github_url: https://github.com/the-lupaxa-project

  default_language: en

# =============================================================================
# Catalogue Sources
# =============================================================================
#
# Paths are relative to the repository root.

catalogues:
  projects: portal/projects.yml
  organisations: portal/organisations.yml
  documentation: portal/documentation.yml
  categories: portal/categories.yml

# =============================================================================
# Generated Content
# =============================================================================
#
# Generated pages are written directly into the MkDocs source directory before
# the site is built.
#
# These files must not be edited manually because they will be replaced each
# time the portal generator runs.

output:
  projects: mkdocs/projects/index.md
  organisations: mkdocs/organisations/index.md
  toolboxes: mkdocs/toolboxes/index.md
  documentation: mkdocs/documentation/index.md
  catalogue_data: mkdocs/assets/data/catalogue.json

# =============================================================================
# Publication
# =============================================================================

publication:
  published_field: published

  published_value: true

  default_published: false

  include_unpublished: false

# =============================================================================
# Ordering
# =============================================================================
#
# Entries are ordered by their explicit order value first and then by name.
#
# Large gaps between order values are intentional and make it easy to insert
# new entries without renumbering the entire catalogue.

ordering:
  primary_field: order

  secondary_field: name

  missing_order: 999999

# =============================================================================
# Featured Content
# =============================================================================

featured:
  projects:
    enabled: true
    maximum: 8

  organisations:
    enabled: true
    maximum: 8

  documentation:
    enabled: true
    maximum: 8

  categories:
    enabled: true
    maximum: 12

# =============================================================================
# Organisation Groups
# =============================================================================
#
# Organisation entries use their type field to determine which section they
# appear in.

organisation_groups:
  - id: central

    name: Central Organisations

    description: >-
      Organisations containing shared standards, templates, documentation and
      project-wide resources.

    order: 10

  - id: toolbox

    name: Technical Toolboxes

    description: >-
      Focused organisations containing projects and resources for specific
      technical disciplines.

    order: 20

  - id: internal

    name: Internal Organisations

    description: >-
      Organisations containing internal tools and operational resources used
      by The Lupaxa Project team.

    order: 30

  - id: experimental

    name: Experimental Organisations

    description: >-
      Organisations containing experiments, prototypes, demonstrations and
      early-stage projects.

    order: 40

# =============================================================================
# Documentation Groups
# =============================================================================
#
# Documentation entries use their type field to determine which section they
# appear in.

documentation_groups:
  - id: project

    name: Project Documentation

    description: >-
      Installation, configuration, usage and reference documentation for
      individual projects.

    order: 10

  - id: organisation

    name: Organisation Documentation

    description: >-
      Documentation and guidance belonging to a specific organisation.

    order: 20

  - id: guide

    name: Guides

    description: >-
      Practical guides covering common workflows and technical tasks.

    order: 30

  - id: reference

    name: Reference Material

    description: >-
      Shared technical references, standards and supporting resources.

    order: 40

  - id: standard

    name: Standards

    description: >-
      Shared requirements and conventions used across The Lupaxa Project.

    order: 50

  - id: policy

    name: Policies

    description: >-
      Project-wide policies covering contribution, conduct, security and
      support.

    order: 60

# =============================================================================
# Category Groups
# =============================================================================
#
# Categories use their group field to determine how they are organised on
# category and filtering interfaces.

category_groups:
  - id: platform
    name: Platforms and Source Control
    order: 10

  - id: engineering
    name: Engineering and Automation
    order: 20

  - id: infrastructure
    name: Cloud and Infrastructure
    order: 30

  - id: security
    name: Security
    order: 40

  - id: operations
    name: Monitoring and Operations
    order: 50

  - id: development
    name: Development
    order: 60

  - id: data
    name: Data
    order: 70

  - id: project
    name: Project Resources
    order: 80

  - id: community
    name: Community and Policies
    order: 90

  - id: experimental
    name: Experimental Work
    order: 100

# =============================================================================
# Validation
# =============================================================================

validation:
  fail_on_error: true

  fail_on_warning: false

  require_unique_ids: true

  require_known_categories: true

  require_known_organisations: true

  require_known_projects: true

  require_known_group_types: true

  require_urls_for_published_entries: true

# =============================================================================
# Optional GitHub Metadata
# =============================================================================
#
# GitHub metadata enrichment is disabled initially.
#
# When enabled later, it may add supplementary details such as the primary
# language, licence and latest release. It must never automatically publish a
# repository or replace curated names and descriptions.

github:
  enrichment:
    enabled: false

    override_curated_values: false

    fields:
      - archived
      - default_branch
      - forks_count
      - language
      - license
      - open_issues_count
      - pushed_at
      - stars_count
      - topics
      - updated_at
      - visibility

  api:
    base_url: https://api.github.com

    api_version: "2022-11-28"

    token_environment_variable: GITHUB_TOKEN

# =============================================================================
# Presentation
# =============================================================================

presentation:
  show_categories: true

  show_technologies: true

  show_maturity: true

  show_status: true

  show_visibility: false

  show_repository_links: true

  show_documentation_links: true

  show_empty_sections: false

  external_links_in_new_tab: false
